name: 编译 Mac 版 (Apple Silicon)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install --break-system-packages PySide6 requests watchdog nuitka pillow pywebview pyobjc-framework-WebKit

      - name: 编译
        shell: bash
        run: |
          python -m nuitka --standalone --macos-create-app-bundle \
            --enable-plugin=pyside6 --output-dir=dist \
            --macos-app-name="英雄联盟对局文件助手" \
            --macos-app-version="0.4" \
            --macos-app-icon=client/icon.icns \
            --assume-yes-for-downloads \
            client/client.py

      - name: 制作 DMG
        shell: bash
        run: |
          python3 -c "from PIL import Image,ImageDraw;w,h=530,420;img=Image.new('RGBA',(w,h),(0,0,0,0));draw=ImageDraw.Draw(img);[(exec('r=int(220-(y/'+str(h)+')*20);g=int(235-(y/'+str(h)+')*15);b=int(255-(y/'+str(h)+')*10);draw.line([(0,y),(w-1,y)],fill=(r,g,b,255))')) for y in range(h)];img.save('dist/dmg_bg.png')"
          mkdir -p dist/dmg_temp/.background
          cp dist/dmg_bg.png dist/dmg_temp/.background/
          cp -R dist/client.app dist/dmg_temp/英雄联盟对局文件助手.app
          ln -s /Applications dist/dmg_temp/Applications
          chflags hidden dist/dmg_temp/.background
          hdiutil create -volname "英雄联盟对局文件助手" -srcfolder dist/dmg_temp -ov -format UDZO dist/英雄联盟对局文件助手-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: 英雄联盟对局文件助手-Mac-arm64
          path: dist/英雄联盟对局文件助手-arm64.dmg
