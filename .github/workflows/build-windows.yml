name: 编译 Windows / Mac 版

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 requests watchdog nuitka

      - name: 编译
        run: |
          python -m nuitka --standalone --onefile --windows-console-mode=disable `
            --enable-plugin=pyside6 --output-dir=dist `
            --product-name="英雄联盟对局文件助手" `
            --file-version="1.0.0" `
            --windows-icon-from-ico=client\icon.ico `
            --assume-yes-for-downloads `
            client\client.py

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: 英雄联盟对局文件助手-Windows
          path: dist/client.exe

  build-macos:
    runs-on: macos-13  # Intel runner → x86_64 二进制，所有 Mac 都能跑
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: |
          pip install PySide6 requests watchdog nuitka pillow

      - name: 生成 icon.icns
        run: |
          python3 -c "
from PIL import Image
import base64, io
with open('client/client.py') as f:
    c = f.read()
s = c.find('APP_ICON_B64 = \"\"\"') + 18
e = c.find('\"\"\"', s)
b64 = c[s:e].strip().replace(chr(10), '')
img = Image.open(io.BytesIO(base64.b64decode(b64)))
iconset = 'client/AppIcon.iconset'
import os; os.makedirs(iconset, exist_ok=True)
for px in [16, 32, 64, 128, 256, 512]:
    r = img.resize((px, px), Image.LANCZOS)
    r.save(f'{iconset}/icon_{px}x{px}.png')
    if px < 1024:
        r2 = img.resize((px*2, px*2), Image.LANCZOS)
        r2.save(f'{iconset}/icon_{px}x{px}@2x.png')
os.system('iconutil -c icns client/AppIcon.iconset -o client/icon.icns 2>/dev/null')
os.system('rm -rf client/AppIcon.iconset')
print('icon.icns done')
"

      - name: 编译
        run: |
          python -m nuitka --standalone --macos-create-app-bundle             --enable-plugin=pyside6 --output-dir=dist             --macos-app-name="英雄联盟对局文件助手"             --macos-app-version="0.2"             --macos-app-icon=client/icon.icns             --assume-yes-for-downloads             client/client.py

      - name: 制作 DMG
        run: |
          python3 -c "
from PIL import Image, ImageDraw
w, h = 530, 420
img = Image.new('RGBA', (w, h), (0,0,0,0))
draw = ImageDraw.Draw(img)
for y in range(h):
    r = int(220 - (y/h)*20)
    g = int(235 - (y/h)*15)
    b = int(255 - (y/h)*10)
    draw.line([(0,y),(w-1,y)], fill=(r,g,b,255))
img.save('dist/dmg_bg.png')
"
          mkdir -p dist/dmg_temp/.background
          cp dist/dmg_bg.png dist/dmg_temp/.background/
          cp -R dist/client.app dist/dmg_temp/英雄联盟对局文件助手.app
          ln -s /Applications dist/dmg_temp/Applications
          chflags hidden dist/dmg_temp/.background
          hdiutil create -volname "英雄联盟对局文件助手" -srcfolder dist/dmg_temp -ov -format UDZO dist/英雄联盟对局文件助手.dmg 2>&1 | tail -2

      - name: 上传 DMG
        uses: actions/upload-artifact@v4
        with:
          name: 英雄联盟对局文件助手-Mac
          path: dist/英雄联盟对局文件助手.dmg
