name: 编译 Windows 版

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - run: pip install PySide6 requests watchdog nuitka

      - name: 编译
        shell: cmd
        run: |
          python -m nuitka --standalone --onefile --windows-console-mode=disable ^
            --enable-plugin=pyside6 --output-dir=dist ^
            --product-name="英雄联盟对局文件助手" ^
            --file-version="1.0.0" ^
            --windows-icon-from-ico=client\icon.ico ^
            --assume-yes-for-downloads ^
            client\client.py

      - uses: actions/upload-artifact@v4
        with:
          name: 英雄联盟对局文件助手-Windows
          path: dist/client.exe
